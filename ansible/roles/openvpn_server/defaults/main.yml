---
openvpn_port: 1194
openvpn_protocol: udp
openvpn_interface: tun0
openvpn_tunnel_network: 10.8.0.0
openvpn_tunnel_netmask: 255.255.255.0

# Route pushed to VPN clients. It contains the WordPress EC2 private address.
openvpn_private_network: 10.20.0.0
openvpn_private_netmask: 255.255.0.0

# Public EIP discovered by the AWS inventory plugin.
openvpn_endpoint: "{{ ansible_host }}"

# Public source CIDRs allowed to reach SSH and OpenVPN on the host firewall.
openvpn_admin_cidrs: []
openvpn_clients:
  - admin

openvpn_web_ports:
  - "80"
  - "443"
openvpn_allow_ssh_via_tunnel: true
openvpn_configure_wordpress_private_url: true
openvpn_wordpress_root: /var/www/html
openvpn_wordpress_ready_file: /var/lib/wordpress-installation-complete
openvpn_wordpress_private_url: "http://{{ ansible_default_ipv4.address }}"

openvpn_easyrsa_dir: /etc/openvpn/easy-rsa
openvpn_server_dir: /etc/openvpn/server
openvpn_server_name: server
openvpn_service_name: openvpn-server@server.service
openvpn_client_output_dir: "{{ playbook_dir }}/client-configs"
