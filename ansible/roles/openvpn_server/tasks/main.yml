---
- name: Validate OpenVPN configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - openvpn_protocol == "udp"
      - openvpn_endpoint | length > 0
      - openvpn_admin_cidrs | length > 0
      - "'0.0.0.0/0' not in openvpn_admin_cidrs"
      - openvpn_clients | length > 0
      - openvpn_clients | reject('match', '^[A-Za-z0-9_.-]+$') | list | length == 0
    fail_msg: >-
      This role requires Ubuntu/Debian, UDP, at least one client, and at least
      one restricted admin CIDR. 0.0.0.0/0 is intentionally forbidden.

- name: Install OpenVPN packages
  ansible.builtin.apt:
    name:
      - easy-rsa
      - openvpn
      - openssl
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create OpenVPN directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openvpn_easyrsa_dir }}"
      mode: "0700"
    - path: "{{ openvpn_server_dir }}"
      mode: "0700"

- name: Install the Easy-RSA tooling
  ansible.builtin.copy:
    src: /usr/share/easy-rsa/
    dest: "{{ openvpn_easyrsa_dir }}/"
    owner: root
    group: root
    mode: preserve
    remote_src: true

- name: Initialize the PKI
  ansible.builtin.command:
    argv:
      - "{{ openvpn_easyrsa_dir }}/easyrsa"
      - init-pki
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_easyrsa_dir }}/pki"

- name: Create the certificate authority
  ansible.builtin.command:
    argv:
      - "{{ openvpn_easyrsa_dir }}/easyrsa"
      - build-ca
      - nopass
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki/ca.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_easyrsa_dir }}/pki"
    EASYRSA_REQ_CN: "{{ inventory_hostname }} OpenVPN CA"

- name: Create the server certificate
  ansible.builtin.command:
    argv:
      - "{{ openvpn_easyrsa_dir }}/easyrsa"
      - build-server-full
      - "{{ openvpn_server_name }}"
      - nopass
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki/issued/{{ openvpn_server_name }}.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_easyrsa_dir }}/pki"

- name: Create client certificates
  ansible.builtin.command:
    argv:
      - "{{ openvpn_easyrsa_dir }}/easyrsa"
      - build-client-full
      - "{{ item }}"
      - nopass
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki/issued/{{ item }}.crt"
  loop: "{{ openvpn_clients }}"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_easyrsa_dir }}/pki"

- name: Create the certificate revocation list
  ansible.builtin.command:
    argv:
      - "{{ openvpn_easyrsa_dir }}/easyrsa"
      - gen-crl
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki/crl.pem"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_easyrsa_dir }}/pki"

- name: Create the tls-crypt key
  ansible.builtin.command:
    argv:
      - openvpn
      - --genkey
      - secret
      - "{{ openvpn_server_dir }}/tls-crypt.key"
    creates: "{{ openvpn_server_dir }}/tls-crypt.key"
  notify: Restart OpenVPN

- name: Install server PKI files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    remote_src: true
  loop:
    - src: "{{ openvpn_easyrsa_dir }}/pki/ca.crt"
      dest: "{{ openvpn_server_dir }}/ca.crt"
      mode: "0644"
    - src: "{{ openvpn_easyrsa_dir }}/pki/issued/{{ openvpn_server_name }}.crt"
      dest: "{{ openvpn_server_dir }}/{{ openvpn_server_name }}.crt"
      mode: "0644"
    - src: "{{ openvpn_easyrsa_dir }}/pki/private/{{ openvpn_server_name }}.key"
      dest: "{{ openvpn_server_dir }}/{{ openvpn_server_name }}.key"
      mode: "0600"
    - src: "{{ openvpn_easyrsa_dir }}/pki/crl.pem"
      dest: "{{ openvpn_server_dir }}/crl.pem"
      mode: "0644"
  notify: Restart OpenVPN

- name: Install the OpenVPN server configuration
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ openvpn_server_dir }}/server.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart OpenVPN

- name: Allow OpenVPN only from trusted public networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "{{ openvpn_port | string }}"
    proto: udp
    comment: Restricted OpenVPN entry
  loop: "{{ openvpn_admin_cidrs }}"

- name: Preserve bootstrap SSH only for trusted public networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "22"
    proto: tcp
    comment: Restricted Ansible SSH
  loop: "{{ openvpn_admin_cidrs }}"

- name: Allow WordPress ports only through the VPN interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ openvpn_interface }}"
    to_port: "{{ item }}"
    proto: tcp
    comment: WordPress over OpenVPN
  loop: "{{ openvpn_web_ports }}"

- name: Allow SSH through the VPN interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ openvpn_interface }}"
    to_port: "22"
    proto: tcp
    comment: SSH over OpenVPN
  when: openvpn_allow_ssh_via_tunnel | bool

- name: Set the default incoming firewall policy
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set the default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable and start OpenVPN
  ansible.builtin.systemd_service:
    name: "{{ openvpn_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the cloud-init WordPress installation
  ansible.builtin.wait_for:
    path: "{{ openvpn_wordpress_ready_file }}"
    state: present
    timeout: 600
  when: openvpn_configure_wordpress_private_url | bool

- name: Configure WordPress to use its private URL
  ansible.builtin.command:
    argv:
      - /usr/local/bin/wp
      - option
      - update
      - "{{ item }}"
      - "{{ openvpn_wordpress_private_url }}"
      - --allow-root
      - "--path={{ openvpn_wordpress_root }}"
  loop:
    - home
    - siteurl
  register: openvpn_wordpress_option_update
  changed_when: "'Updated' in openvpn_wordpress_option_update.stdout"
  when: openvpn_configure_wordpress_private_url | bool

- name: Create the local client-profile directory
  ansible.builtin.file:
    path: "{{ openvpn_client_output_dir }}"
    state: directory
    mode: "0700"
  become: false
  delegate_to: localhost
  run_once: true

- name: Read the certificate authority
  ansible.builtin.slurp:
    src: "{{ openvpn_server_dir }}/ca.crt"
  register: openvpn_ca

- name: Read the tls-crypt key
  ansible.builtin.slurp:
    src: "{{ openvpn_server_dir }}/tls-crypt.key"
  register: openvpn_tls_crypt
  no_log: true

- name: Export client profiles
  ansible.builtin.include_tasks: client.yml
  loop: "{{ openvpn_clients }}"
  loop_control:
    loop_var: openvpn_client_name
