name: wordpress-stack

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-7.1.2}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
        restart: true
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    ports:
      - "${WORDPRESS_PORT:-80}:80"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend
      - backend

  wordpress-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles:
      - setup
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      WORDPRESS_URL: ${WORDPRESS_URL:?Set WORDPRESS_URL in .env}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE:-Test WordPress}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-wpadmin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?Set WORDPRESS_ADMIN_PASSWORD in .env}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - backend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until [ -f /var/www/html/wp-config.php ]; do
          sleep 2
        done

        if ! wp core is-installed --path=/var/www/html; then
          wp core install \
            --path=/var/www/html \
            --url="$${WORDPRESS_URL}" \
            --title="$${WORDPRESS_TITLE}" \
            --admin_user="$${WORDPRESS_ADMIN_USER}" \
            --admin_password="$${WORDPRESS_ADMIN_PASSWORD}" \
            --admin_email="$${WORDPRESS_ADMIN_EMAIL}" \
            --skip-email
        fi

volumes:
  mariadb_data:
  wordpress_data:

networks:
  frontend:
  backend:
    internal: true
